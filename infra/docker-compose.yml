services:

  db:
    container_name: foodgram-db
    image: postgres:13
    env_file: .env
    volumes:
      - ../data/db:/var/lib/postgresql/data/

  backend:
    container_name: foodgram-back
    build: ../backend
    env_file: .env
    volumes:
      - ../backend:/app
      - ../data:/app/data
    depends_on:
      - db

  frontend:
    container_name: foodgram-front
    build: ../frontend
    volumes:
      - ../frontend/:/app/result_build/
  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs:/usr/share/nginx/html/api/docs # для лока поменять на - "C:/Users/zahar/Documents/DEV/Yandex/foodgram/docs:/usr/share/nginx/html/api/docs"
      - ../backend/static:/static
      - ../backend/media:/media
