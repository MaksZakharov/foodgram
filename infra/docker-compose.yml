services:

  db:
    container_name: foodgram-db
    image: postgres:13
    env_file: ../.env
    volumes:
      - ../data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    container_name: foodgram-back
    build: ../backend
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../backend/static:/app/static
      - ../backend/media:/app/media
      - ../data:/app/data
    command: >
      bash -c "
      for i in {1..60}; do
        (echo > /dev/tcp/db/5432) >/dev/null 2>&1 && break;
        echo 'Waiting for db...'; sleep 2;
      done;
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn foodgram_backend.wsgi:application --bind 0.0.0.0:8000"

  # frontend:
  #   container_name: foodgram-front
  #   build: ../frontend
  #   volumes:
  #     - ../frontend/build:/app/result_build

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    depends_on:
      - backend
    #  - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "C:/Users/zahar/Documents/DEV/Yandex/foodgram/frontend/build:/usr/share/nginx/html:ro" # - ../frontend/build:/usr/share/nginx/html:ro
      - ../backend/static:/static:ro
      - ../backend/media:/media:ro
      - ../docs:/docs:ro
