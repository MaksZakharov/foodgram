server {
    listen 80;
    server_name foodgram.3utilities.com localhost;

    client_max_body_size 10M;
    server_tokens off;

    # React SPA (главная страница)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # React ассеты
    location /static/js/ {
        alias /usr/share/nginx/html/static/js/;
    }
    location /static/css/ {
        alias /usr/share/nginx/html/static/css/;
    }
    location /static/media/ {
        alias /usr/share/nginx/html/static/media/;
    }

    # Django админка (css/js)
    location /static/admin/ {
        alias /static/admin/;
    }

    # Django DRF (стили DRF-браузера)
    location /static/rest_framework/ {
        alias /static/rest_framework/;
    }

    # Django медиа
    location /media/ {
        alias /media/;
    }

    # Django админка (страница /admin/)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ReDoc
    location /api/docs/ {
    alias /docs/;
    index redoc.html;
    }
}
