server {
    listen 80;
    server_name foodgram.3utilities.com localhost;

    client_max_body_size 10M;
    server_tokens off;

    # SPA (React)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Фронтовая статика из build/
    location /static/ {
        root /usr/share/nginx/html;
    }

    # Вся Django-статика (STATIC_URL=/backend_static/)
    location /backend_static/ {
        alias /static/;
    }

    # Медиа Django
    location /media/ {
        alias /media/;
    }

    # Админка Django
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ReDoc (если монтируешь docs)
    location /api/docs/ {
        alias /usr/share/nginx/html/api/docs/;
        index redoc.html;
    }
}
