[flake8]
ignore =
    W503,
    F811
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    */venv/,
    env/,
    */env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
profile = black
src_paths = backend

[tool:ruff]
line-length = 88

[tool:ruff.isort]
known-first-party = backend
combine-as-imports = true