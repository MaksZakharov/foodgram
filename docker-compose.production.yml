volumes:
  pg_data_production:
  static:
  media:
  docs:
  frontend_build:   # общий том для билда фронта

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: flintman16/foodgram_backend:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/static
      - ./media:/app/media
      - docs:/docs
    command: >
      bash -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn foodgram_backend.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    image: flintman16/foodgram_frontend:latest
    volumes:
      - frontend_build:/app/build

  gateway:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/frontend_build
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static:/static
      - ./media:/media
      - ./docs:/docs
